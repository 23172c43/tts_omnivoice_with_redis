# ============================================================
# OmniVoice TTS — Docker Compose
# ============================================================
# Services:
#   redis       — Celery broker + backend
#   tts_api     — FastAPI server (port 8989)
#   tts_worker  — Celery worker (GPU 1, /dev/shm)
# ============================================================

x-docker-log-rotation: &docker-log-rotation
  driver: json-file
  options:
    max-size: "20m"
    max-file: "7"

services:
  redis:
    image: redis:7-alpine
    restart: always
    logging: *docker-log-rotation
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tts_api:
    build: .
    image: omnivoice-tts:latest
    restart: always
    logging: *docker-log-rotation
    ports:
      - "8989:8989"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PORT=8989
      - MODEL_DIR=/app/local_models/k2-fsa/OmniVoice
      - LOG_SERVICE=api
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
      - LOG_ROTATION_WHEN=midnight
      - LOG_ROTATION_INTERVAL=1
      - LOG_BACKUP_COUNT=7
      - LOG_UTC=true
    volumes:
      - ./local_models:/app/local_models
      - ./voice_data:/app/voice_data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8989/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tts_worker:
    build: .
    image: omnivoice-tts:latest
    restart: unless-stopped
    logging: *docker-log-rotation
    runtime: nvidia
    command: celery -A app.worker.celery_app worker --loglevel=info -c 1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_DIR=/app/local_models/k2-fsa/OmniVoice
      - NVIDIA_VISIBLE_DEVICES=1
      - LOG_SERVICE=worker
      - LOG_DIR=/app/logs
      - LOG_LEVEL=INFO
      - LOG_ROTATION_WHEN=midnight
      - LOG_ROTATION_INTERVAL=1
      - LOG_BACKUP_COUNT=7
      - LOG_UTC=true
    volumes:
      - ./local_models:/app/local_models
      - ./voice_data:/app/voice_data
      - ./logs:/app/logs
      - /dev/shm/audio:/dev/shm/audio
    shm_size: 256mb
    depends_on:
      redis:
        condition: service_healthy
